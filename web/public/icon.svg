<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Warm Radio Dial Background -->
  <rect width="512" height="512" rx="128" fill="#0E0D0C"/>
  <rect x="4" y="4" width="504" height="504" rx="124" stroke="#2A2724" stroke-width="8"/>

  <!-- Subtle ambient inner glow ring -->
  <circle cx="256" cy="256" r="180" stroke="#F2B544" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8"/>

  <!-- Left & Right Radiating Broadcast Signal Arcs -->
  <!-- Outer arcs -->
  <path d="M140 180 A140 140 0 0 0 140 332" stroke="#F2B544" stroke-width="20" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M372 180 A140 140 0 0 1 372 332" stroke="#F2B544" stroke-width="20" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Inner arcs -->
  <path d="M185 208 A85 85 0 0 0 185 304" stroke="#F2B544" stroke-width="22" stroke-linecap="round"/>
  <path d="M327 208 A85 85 0 0 1 327 304" stroke="#F2B544" stroke-width="22" stroke-linecap="round"/>

  <!-- Center "I" Broadcast Pillar -->
  <rect x="238" y="246" width="36" height="136" rx="18" fill="#F4EFE8"/>

  <!-- Center Live Signal Beacon Dot -->
  <circle cx="256" cy="186" r="26" fill="#FF4A3D"/>
  <circle cx="256" cy="186" r="38" stroke="#FF4A3D" stroke-width="4" stroke-opacity="0.4"/>
</svg>
